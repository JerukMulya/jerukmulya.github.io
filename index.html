<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUM Desa - Ketahanan Pangan</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
      color: #1c1c1c;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
    }
    .logo {
      font-weight: 700;
      font-size: 20px;
    }
    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px 40px;
      max-width: 1200px;
      margin: auto;
    }
    .hero-text {
      max-width: 550px;
    }
    .hero-text h1 {
      font-size: 48px;
      line-height: 1.2;
      margin-bottom: 20px;
    }
    .hero-text p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }
    .hero-text .buttons {
      display: flex;
      gap: 15px;
    }
    .hero-text .buttons a {
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.3s;
    }
    .btn-primary {
      background-color: #1c1c1c;
      color: white;
    }
    .btn-primary:hover {
      background-color: #333;
    }
    .btn-secondary {
      background-color: #f0f0f0;
      color: #1c1c1c;
      border: 1px solid #ccc;
    }
    .btn-secondary:hover {
      background-color: #e4e4e4;
    }
    .hero-image img {
      width: 500px;
      max-width: 100%;
    }
    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }
      .hero-image {
        margin-top: 40px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">BUMDes Mandiri</div>
    <nav>
      <a href="#">Beranda</a>
      <a href="#">Tentang</a>
      <a href="#">Program</a>
      <a href="#">Kontak</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>Ketahanan Pangan Dimulai dari Desa</h1>
      <p>Platform BUMDes untuk mendukung peternakan lokal, distribusi pangan sehat, dan kemandirian ekonomi warga.</p>
      <div class="buttons">
        <a href="#" class="btn-primary">Mulai Sekarang</a>
        <a href="#" class="btn-secondary">Pelajari Lebih Lanjut</a>
      </div>
    </div>
    <div class="hero-image">
      <img src="https://source.unsplash.com/600x400/?farming,livestock" alt="Ilustrasi Peternakan">
    </div>
  </section>

</body>
</html>
